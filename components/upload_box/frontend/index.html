<div id="drop-zone" class="drop-zone">
  <div class="drop-icon">📄</div>
  <div class="drop-title">Drop your Japanese subtitle file here</div>
  <div class="drop-subtitle">or <span class="browse-link">click to browse</span></div>
  <div class="drop-badge">Supports .srt files</div>
  <div id="file-info" class="file-info hidden"></div>
  <input type="file" id="file-input" accept=".srt" style="display: none;">
</div>
